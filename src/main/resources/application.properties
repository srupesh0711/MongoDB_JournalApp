spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=journalApp

# It is highly recommended to use a long, complex, and randomly generated string for your secret.
jwt.secret=a-very-long-and-secure-secret-key-that-is-not-easy-to-guess-and-is-at-least-512-bits-long-for-hs512

# JWT expiration time in milliseconds (e.g., 10 hours = 36000000)
jwt.expiration=36000000

# OTP expiration time in minutes
otp.expiration.minutes=5

# Twilio Configuration
# WARNING: Do not commit real credentials to version control.
# Use environment variables or a secrets management service for production.
twilio.account.sid=***TwilioSID****
twilio.auth.token=****twilioToken*******
twilio.phone.number=***TwiloNumber****
